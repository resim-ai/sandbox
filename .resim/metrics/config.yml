version: 1

topics:
  detection_results:
    schema:
      filename: string
      num_ground_truth: int
      num_true_positives: int
      num_false_positives: int
      num_false_negatives: int
      enhanced_image_path: string
  
  # Raw detection data for PR curve calculation
  detection_raw:
    schema:
      filename: string
      detection_id: string
      confidence: float
      x1: float
      y1: float
      x2: float
      y2: float
      matched_gt_id: string
      iou_score: float
      is_true_positive: boolean
  
  # Ground truth objects for PR curve calculation
  ground_truth_raw:
    schema:
      filename: string
      gt_id: string
      x1: float
      y1: float
      x2: float
      y2: float
      matched_detection_id: string
      iou_score: float
      is_detected: boolean

metrics:
  # Number of ground truth objects
  Number of Ground Truth Objects:
    type: test
    description: Count of ground truth objects in the image
    query_string: SELECT num_ground_truth as "Ground Truth Objects" FROM detection_results
    template_type: system
    template: scalar
  
  # Number of true positives
  Number of True Positives:
    type: test
    description: Count of correctly detected objects (IoU >= 0.5)
    query_string: SELECT num_true_positives as "True Positives" FROM detection_results
    template_type: system
    template: scalar
  
  # Number of false positives
  Number of False Positives:
    type: test
    description: Count of incorrect detections (no matching ground truth)
    query_string: SELECT num_false_positives as "False Positives" FROM detection_results
    template_type: system
    template: scalar
  
  # Number of false negatives
  Number of False Negatives:
    type: test
    description: Count of missed ground truth objects
    query_string: SELECT num_false_negatives as "False Negatives" FROM detection_results
    template_type: system
    template: scalar
  
  # Enhanced visualization image
  Detection Visualization:
    type: test
    description: Enhanced visualization showing all detections with IDs and match indicators
    query_string: SELECT enhanced_image_path as "Image" FROM detection_results
    template_type: system
    template: image
  
  # Precision-Recall curve data
  Precision-Recall Curve Data:
    type: test
    description: Raw detection data for generating precision-recall curves at different confidence thresholds
    query_string: SELECT filename as "Image", detection_id as "Detection ID", confidence as "Confidence", is_true_positive as "Is True Positive", iou_score as "IoU Score" FROM detection_raw ORDER BY confidence DESC
    template_type: system
    template: scalar

metrics sets:
  perception metrics:
    metrics:
      - Number of Ground Truth Objects
      - Number of True Positives
      - Number of False Positives
      - Number of False Negatives
      - Detection Visualization
      - Precision-Recall Curve Data